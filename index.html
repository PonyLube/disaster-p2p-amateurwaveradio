<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>災害用P2Pトランシーバー (カモフラージュモード)</title>
    <style>
        :root {
            --bg-color: #111411;
            --panel-color: #1a1f1a;
            --accent-color: #4ef037; 
            --danger-color: #ff3b30;
            --text-color: #e0e5e0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; 
        }
        #app-root {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .logo-yaku {
            font-size: 28px;
            font-weight: bold;
            color: #444; 
            cursor: pointer;
            transition: color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }
        .ready-to-ignite {
            color: var(--accent-color) !important;
            text-shadow: 0 0 8px var(--accent-color);
        }
        .transceiver-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        .status-display {
            background-color: var(--panel-color);
            border: 1px solid #2a332a;
            padding: 15px 30px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            width: 80%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .ptt-button {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 0%, #111 100%);
            border: 4px solid #333;
            color: #666;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .ptt-button:active {
            transform: scale(0.96);
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 20px rgba(78, 240, 55, 0.4);
        }
        .tactical-hud {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 15px;
            padding-top: 20px;
        }
        .left-line-stream {
            flex: 1;
            background-color: rgba(0, 10, 0, 0.6);
            border: 1px solid var(--accent-color);
            padding: 10px;
            overflow-y: auto;
            border-radius: 4px;
            font-size: 12px;
        }
        .msg-bubble {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 4px;
            background-color: #1a241a;
            border-left: 3px solid var(--accent-color);
        }
    </style>
</head>
<body>
<div id="app-root">
    <header>
        <div>SYS_STATUS: <span id="sys-mode">PUBLIC_P2P</span></div>
        <div id="yaku-trigger" class="logo-yaku" onclick="window.engine.handleYakuTap()">龠</div>
    </header>
    <div id="main-content" class="transceiver-panel">
        <div class="status-display">
            <div>[方位角: <span id="azimuth-val">待機中</span>]</div>
            <div style="margin-top:5px; color:#666;">P2P CHANNEL: 01 (MUTE)</div>
        </div>
        <div class="ptt-button" id="ptt-btn">PUSH TO TALK</div>
    </div>
</div>
<script>
// =========================================================================
// 📡 [Block-17: MHOP] ❌ [Block-18: SWCH] 圏外P2Pマルチホップ＆線路切り替え
// =========================================================================
class TacticalMultiHopEngine {
    constructor(parentEngine) {
        this.parent = parentEngine;
        this.blackboxStorageKey = "OFFLINE_TACTICAL_BLACKBOX";
        this.isSearchingP2P = false;
        setInterval(() => this.auditNetworkAndSwitchRoute(), 10000);
    }

    async auditNetworkAndSwitchRoute() {
        if (!navigator.onLine) {
            if (!this.isSearchingP2P) {
                this.isSearchingP2P = true;
                this.parent.leftLineHistory.unshift("[SWCH] 完全圏外：P2P索敵開始...");
                this.parent.refreshHUD();
            }
            return;
        }
        try {
            const check = await fetch('http://127.0.0', { method: 'POST', body: 'ping' });
            const res = await check.text();
            if (res === "E" || res === "A") {
                await this.flushBlackboxToFortress();
            }
        } catch (e) {}
    }

    isolatePacketToBlackbox(packetString) {
        let currentBox = this.getBlackboxContent();
        currentBox.push({ timestamp: Date.now(), packet: packetString });
        localStorage.setItem(this.blackboxStorageKey, JSON.stringify(currentBox));
        this.parent.triggerTacticalVibe('fail');
    }

    getBlackboxContent() {
        const data = localStorage.getItem(this.blackboxStorageKey);
        return data ? JSON.parse(data) : [];
    }

    async flushBlackboxToFortress() {
        const box = this.getBlackboxContent();
        if (box.length === 0) return;
        for (const item of box) {
            try {
                const response = await fetch('http://127.0.0', {
                    method: 'POST',
                    body: `${item.packet},1`
                });
                if (await response.text() !== "A") throw new Error();
            } catch (e) {
                return;
            }
        }
        localStorage.removeItem(this.blackboxStorageKey);
        this.isSearchingP2P = false;
        this.parent.triggerTacticalVibe('success');
        this.parent.leftLineHistory.unshift("[大勝利] 幽閉パケット要塞フラッシュ＆シュレッド成功。");
        this.parent.refreshHUD();
    }
}
// =========================================================================
// 📱 フロントエンド・コアコントローラー (長押し競合バグ完全修正版)
// =========================================================================
class TacticalFrontEndEngine {
    constructor() {
        this.currentHeading = 0;
        this.yakuTapCount = 0;
        this.modeLevel = 1; 
        this.leftLineHistory = [
            "システム初期化完了。電波監視中...",
            "引き戦の美学：未来予測ノイズを排除。"
        ];

        this.initCompass();
        this.initHapticAndPTT();
        this.multiHop = new TacticalMultiHopEngine(this); 
    }

    initCompass() {
        const handleOrientation = (e) => {
            let heading = e.webkitCompassHeading || e.alpha || 0;
            this.currentHeading = heading;
            
            const azimuthDisplay = document.getElementById('azimuth-val');
            if (azimuthDisplay) {
                azimuthDisplay.innerText = Math.round(this.currentHeading) + "°";
            }
            this.evaluateSecurityProximity();
        };

        window.addEventListener('deviceorientation', handleOrientation, true);
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    }

    evaluateSecurityProximity() {
        const isHeadingNorth = this.currentHeading <= 10 || this.currentHeading >= 350;
        const triggerIndicator = document.getElementById('yaku-trigger');
        
        if (triggerIndicator) {
            if (isHeadingNorth) {
                triggerIndicator.classList.add('ready-to-ignite');
                return true;
            } else {
                triggerIndicator.classList.remove('ready-to-ignite');
                this.yakuTapCount = 0;
                return false;
            }
        }
        return false;
    }

    handleYakuTap() {
        if (!this.evaluateSecurityProximity()) {
            this.triggerTacticalVibe('double-heavy');
            return;
        }
        this.yakuTapCount++;
        this.triggerTacticalVibe('light');

        if (this.yakuTapCount === 7) {
            this.yakuTapCount = 0;
            this.showPinModal();
        }
    }

    async showPinModal() {
        const pin = prompt("ENTER TACTICAL ACCESS CODE (6-DIGIT):");
        if (!pin || pin.length !== 6) return;

        try {
            await fetch('http://127.0.0', {
                method: 'POST',
                body: `auth-request,0,0,0,${pin},0,EasterEgg解除アタック`
            });
        } catch (e) {}

        if (pin === "893110") {
            this.modeLevel = 2;
            this.activateTacticalHUD("EASTER_EGG_LINK");
        } else if (pin === "000000") {
            this.modeLevel = 3;
            this.activateTacticalHUD("GENERAL_MANAGER_MODE");
        } else {
            this.triggerTacticalVibe('fail');
            alert("通信線路切断：通常モードを維持します。");
        }
    }

    triggerTacticalVibe(type) {
        if (!navigator.vibrate) return;
        switch (type) {
            case 'light': navigator.vibrate(20); break;
            case 'heavy': navigator.vibrate(80); break;
            case 'double-heavy': navigator.vibrate(200); break;
            case 'success': navigator.vibrate([40, 40, 40]); break;
            case 'fail': navigator.vibrate([100, 50, 100]); break;
            case 'squelch': navigator.vibrate(15); break; 
        }
    }

    initHapticAndPTT() {
        const pttBtn = document.getElementById('ptt-btn');
        if (!pttBtn) return;

        const preventDefaults = (e) => {
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();
        };
        pttBtn.addEventListener('contextmenu', preventDefaults);
        pttBtn.addEventListener('selectstart', preventDefaults);

        pttBtn.addEventListener('touchstart', (e) => {
            preventDefaults(e); 
            this.triggerTacticalVibe('squelch');
            pttBtn.innerText = "TRANSMITTING...";
        }, { passive: false });

        pttBtn.addEventListener('touchend', (e) => {
            preventDefaults(e);
            pttBtn.innerText = "PUSH TO TALK";
            this.triggerTacticalVibe('light');
            this.injectLivePacket("カメの子スタック発見。大名栗の核心部が実質cooked状態。");
        }, { passive: false });
    }

    async injectLivePacket(messageText) {
        const packet = `client-alpha,35.9231,139.1124,450.2,1,12.5,${messageText}`;
        try {
            const response = await fetch('http://127.0.0', {
                method: 'POST',
                body: packet
            });
            if (await response.text() === "A") {
                this.triggerTacticalVibe('success');
                this.leftLineHistory.unshift(`[200OK] 要塞受信: ${messageText}`);
                this.refreshHUD();
            }
        } catch (e) {
            this.multiHop.isolatePacketToBlackbox(packet);
            this.leftLineHistory.unshift(`[完全圏外] ブラックボックスへ隔離: ${messageText}`);
            this.refreshHUD();
        }
    }

    activateTacticalHUD(statusName) {
        this.triggerTacticalVibe('success');
        const modeDisplay = document.getElementById('sys-mode');
        if (modeDisplay) {
            modeDisplay.innerText = statusName;
            modeDisplay.style.color = 'var(--accent-color)';
        }
        const content = document.getElementById('main-content');
        if (content) {
            content.className = "tactical-hud";
            this.refreshHUD();
        }
    }

    refreshHUD() {
        const content = document.getElementById('main-content');
        if (content && this.modeLevel > 1) {
            content.innerHTML = `
                <div class="left-line-stream" id="hud-stream">
                    ${this.leftLineHistory.map(m => `<div class="msg-bubble">${m}</div>`).join('')}
                </div>
                <div style="font-size:11px; color:#555; text-align:center; margin-top:5px;">
                    [車幅1.47m/ジムニー思想駆動中] ❌ [ポート:51800ステルス運用]
                </div>
            `;
        }
    }
}

window.engine = new TacticalFrontEndEngine();
</script>
</body>
</html>
