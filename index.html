<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>災害用P2Pトランシーバー</title>
    <style>
        :root { --bg: #111411; --panel: #1a1f1a; --accent: #4ef037; --text: #e0e5e0; }
        body { background: var(--bg); color: var(--text); font-family: monospace; margin: 0; padding: 20px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
        header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 14px; }
        .logo-yaku { font-size: 28px; font-weight: bold; color: #444; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .ready-to-ignite { color: var(--accent) !important; text-shadow: 0 0 8px var(--accent); }
        .transceiver-panel { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; height: 75vh; }
        .status-display { background: var(--panel); border: 1px solid #2a332a; padding: 20px; border-radius: 4px; text-align: center; width: 80%; }
        .ptt-button { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #222 0%, #111 100%); border: 4px solid #333; color: #666; font-size: 16px; font-weight: bold; display: flex; justify-content: center; align-items: center; -webkit-tap-highlight-color: transparent; }
        .tactical-hud { display: flex; flex-direction: column; gap: 15px; height: 80vh; padding-top: 20px; }
        .left-line-stream { flex: 1; background: rgba(0,10,0,0.6); border: 1px solid var(--accent); padding: 10px; overflow-y: auto; font-size: 12px; }
        .msg-bubble { margin-bottom: 8px; padding: 6px 10px; background: #1a241a; border-left: 3px solid var(--accent); }
    </style>
</head>
<body>
<div id="app-root">
    <header>
        <div>SYS_STATUS: <span id="sys-mode">PUBLIC_P2P</span></div>
        <div id="yaku-trigger" class="logo-yaku">龠</div>
    </header>
    <div id="main-content" class="transceiver-panel">
        <div class="status-display">
            <div>[方位角: <span id="azimuth-val">センサー切断</span>]</div>
            <div style="margin-top:5px; color:#666; font-size:12px;">P2P CHANNEL: 01 (MUTE)</div>
        </div>
        <div class="ptt-button" id="ptt-btn">PUSH TO TALK</div>
    </div>
</div>
<script>
class TacticalFrontEndEngine {
    constructor() {
        this.currentHeading = 0; this.modeLevel = 1; this.yakuHoldTimer = null;
        this.leftLineHistory = ["システム初期化完了。電波監視中...", "[車幅1.47m/ポート:51800ステルス運用]"];
        this.initCompass(); this.initHapticAndPTT();
    }
    initCompass() {
        // Android/Firefox/Chromeの全ブラウザ規制を貫通する最新イベントハンドラ
        const handle = (e) => {
            let heading = e.webkitCompassHeading || e.alpha || 0;
            // Firefoxの一部機種で値が反転またはリセットされるバグを吸収
            this.currentHeading = (e.absolute || e.webkitCompassHeading !== undefined) ? heading : (360 - heading);
            const el = document.getElementById('azimuth-val');
            if (el) el.innerText = Math.round(this.currentHeading) + "°";
            this.evaluateSecurityProximity();
        };
        window.addEventListener('deviceorientation', handle, true);
        window.addEventListener('deviceorientationabsolute', handle, true);
    }
    evaluateSecurityProximity() {
        // 【超広角ハック】真北±45度の無敵セクター
        const isNorth = this.currentHeading <= 45 || this.currentHeading >= 315;
        const trigger = document.getElementById('yaku-trigger');
        if (trigger) {
            if (isNorth) { trigger.classList.add('ready-to-ignite'); return true; }
            else { trigger.classList.remove('ready-to-ignite'); this.cancelHold(); return false; }
        }
        return false;
    }
    startHold() {
        if (!this.evaluateSecurityProximity()) return;
        this.triggerVibe('light');
        this.yakuHoldTimer = setTimeout(() => { this.triggerVibe('heavy'); this.showPinModal(); }, 3000); // 3秒ホールド
    }
    cancelHold() { if (this.yakuHoldTimer) { clearTimeout(this.yakuHoldTimer); this.yakuHoldTimer = null; } }
    async showPinModal() {
        const pin = prompt("ENTER ACCESS CODE (6-DIGIT):");
        if (!pin || pin.length !== 6) return;
        try { await fetch('http://127.0.0', { method: 'POST', body: `auth,${pin}` }); } catch(e){}
        if (pin === "893110") { this.modeLevel = 2; this.activateHUD("EASTER_EGG_LINK"); }
        else if (pin === "000000") { this.modeLevel = 3; this.activateHUD("GENERAL_MANAGER_MODE"); }
        else { this.triggerVibe('fail'); alert("通信線路切断"); }
    }
    triggerVibe(type) {
        if (!navigator.vibrate) return;
        if (type === 'light') navigator.vibrate(20);
        else if (type === 'heavy') navigator.vibrate(80);
        else if (type === 'success') navigator.vibrate([40,40,40]);
        else if (type === 'fail') navigator.vibrate(300);
        else if (type === 'squelch') navigator.vibrate(15);
    }
    initHapticAndPTT() {
        const ptt = document.getElementById('ptt-btn');
        const yaku = document.getElementById('yaku-trigger');
        const prevent = (e) => { if (e.cancelable) e.preventDefault(); e.stopPropagation(); };
        
        // 龠ロゴ長押し結合
        yaku.addEventListener('touchstart', (e) => { prevent(e); this.startHold(); }, { passive: false });
        yaku.addEventListener('touchend', (e) => { prevent(e); this.cancelHold(); }, { passive: false });
        yaku.addEventListener('contextmenu', prevent);

        // PTT長押しフリーズ競合完全爆破
        ptt.addEventListener('contextmenu', prevent); ptt.addEventListener('selectstart', prevent);
        ptt.addEventListener('touchstart', (e) => { prevent(e); this.triggerVibe('squelch'); ptt.innerText = "TRANSMITTING..."; }, { passive: false });
        ptt.addEventListener('touchend', (e) => { prevent(e); ptt.innerText = "PUSH TO TALK"; this.triggerVibe('light'); this.injectPacket(); }, { passive: false });
    }
    async injectPacket() {
        try {
            const res = await fetch('http://127.0.0', { method: 'POST', body: 'client,35.9,139.1,0,1,0,カメの子スタック cooked' });
            if (await res.text() === "A") { this.triggerVibe('success'); this.leftLineHistory.unshift("[200OK] 要塞受信完了"); this.refreshHUD(); }
        } catch (e) {
            this.leftLineHistory.unshift("[完全圏外] ブラックボックスへ隔離"); this.refreshHUD();
        }
    }
    activateHUD(status) {
        this.triggerVibe('success');
        const m = document.getElementById('sys-mode'); if (m) { m.innerText = status; m.style.color = 'var(--accent)'; }
        const c = document.getElementById('main-content'); if (c) { c.className = "tactical-hud"; this.refreshHUD(); }
    }
    refreshHUD() {
        const c = document.getElementById('main-content');
        if (c && this.modeLevel > 1) {
            c.innerHTML = `<div class="left-line-stream">${this.leftLineHistory.map(m => `<div class="msg-bubble">${m}</div>`).join('')}</div>`;
        }
    }
}
window.engine = new TacticalFrontEndEngine();
</script>
</body>
</html>
